base:
  - ".* warning: ignoring old recipe for target 'check'"
  - "sh: warning: setlocale: LC_ALL: cannot change locale \\(C.utf8\\): No such file or directory"
  - "dpkg-buildpackage: warning: using a gain-root-command while being root"
  - "/sbin/ldconfig: Warning: ignoring configuration file that cannot be opened: /etc/ld.so.conf: No such file or directory"
  - "warning: line \\d+: multiple %files for package *"
  - "configure: WARNING: unrecognized options: --disable-dependency-tracking"
  - "WARNING: If you run into issues during linking or bitcode compilation, you can use --without-security-flags."
  - "gpg: WARNING: options in `/root/.gnupg/gpg.conf' are not yet active during this run"
  - ".* warning: overriding recipe for target 'check'"
  - "dpkg-genchanges: warning: the current version .* is earlier than the previous one .*"
  - ".*: warning: '__s' may be used uninitialized in this function \\[-Wmaybe-uninitialized\\].*"
  - ".* unused substitution variable \\$\\{misc:Depends\\}.*"
  - ".*: substitution variable \\$\\{postgresql:Depends\\} unused, but is defined.*"
  - ".* unused substitution variable \\$\\{postgresql:Depends\\}.*"
  - "autoreconf: warning: autoconf input should be named 'configure.ac', not 'configure.in'"
  - "autoheader: warning: autoconf input should be named 'configure.ac', not 'configure.in'"
  - ".*: warning: 'RSA_new' is deprecated: Since OpenSSL 3.0 \\[-Wdeprecated-declarations\\]"
  - ".*: warning: 'RSA_generate_key_ex' is deprecated: Since OpenSSL 3.0 \\[-Wdeprecated-declarations\\]"
  - ".*: warning: 'RSA_new' is deprecated \\[-Wdeprecated-declarations\\]"
  - ".*: warning: 'RSA_generate_key_ex' is deprecated \\[-Wdeprecated-declarations\\]"
  - ".*: warning: 'EVP_PKEY_assign' is deprecated.*"
  - "^cp: warning: behavior of -n is non-portable and may change in future; use --update=none instead$"
  - "\\d+ warnings? generated."
  - ".*: warning: no previous declaration for '.*' \\[-Wmissing-variable-declarations\\]"
  # C23 libc const-preserving return types; retain the released source APIs.
  - "^(?:.*/)?(?:cdc_decoder_utils|citus_safe_lib|worker_data_fetch_protocol)\\.c:\\d+:\\d+: warning: .*\\[-W(?:discarded-qualifiers|incompatible-pointer-types-discards-qualifiers)\\]$"
  # COPY's binary signature is exactly 11 bytes, not a NUL-terminated string.
  - "^.*/multi_copy\\.c:\\d+:\\d+: warning: initializer-string for array of 'char' truncates NUL terminator but destination lacks 'nonstring' attribute \\(12 chars into 11 available\\) \\[-Wunterminated-string-initialization\\]$"

debian:
  - ".*: W: invalid-license Commercial"
  - ".*: W: no-documentation"
rpm:
  - ".*: E: zero-length /usr/pgsql-.*/share/extension/citus.*"
  - ".*: W: invalid-license Commercial"
  - ".*: W: no-documentation"
  - ".*: W: unstripped-binary-or-object /usr/pgsql-.*/bin/pg_send_cancellation"
  - ".*: W: unstripped-binary-or-object /usr/pgsql-.*/lib/citus.so"
  - ".*: W: unstripped-binary-or-object /usr/pgsql-.*/lib/citus_columnar.so"
  - ".*: W: unstripped-binary-or-object /usr/pgsql-.*/lib/citus_decoders/citus_pgoutput.so"
  - ".*: W: unstripped-binary-or-object /usr/pgsql-.*/lib/citus_decoders/citus_wal2json.so"
  - ".*: W: unstripped-binary-or-object /usr/pgsql-.*/lib/citus_pgoutput.so"
  - ".*: W: unstripped-binary-or-object /usr/pgsql-.*/lib/citus_wal2json.so"
  - ".*: W: unstripped-binary-or-object /usr/pgsql-.*/lib/citus_decoders/wal2json.so"
  - ".*: W: unstripped-binary-or-object /usr/pgsql-.*/lib/citus_decoders/pgoutput.so"
