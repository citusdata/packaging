name: Build and publish citus community nightly packages

env:
  MAIN_BRANCH: "all-citus"
  PACKAGE_CLOUD_REPO_NAME: "citusdata/community-nightlies"
  PACKAGE_CLOUD_API_TOKEN: ${{ secrets.PACKAGE_CLOUD_API_TOKEN }}
  PACKAGING_PASSPHRASE: ${{ secrets.PACKAGING_PASSPHRASE }}
  PACKAGING_SECRET_KEY: ${{ secrets.PACKAGING_SECRET_KEY }}
  DOCKERHUB_USER_NAME: ${{ secrets.DOCKERHUB_USER_NAME }}
  DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
on:
  push:
    branches: ["**"]
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve_nightly_ref:
    name: Pin Citus main commit SHA
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - id: sha
        run: |
          sha=$(git ls-remote https://github.com/citusdata/citus.git refs/heads/main | awk '{print $1}')
          [ -n "${sha}" ] || { echo "Failed to resolve citusdata/citus main SHA" >&2; exit 1; }
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

  build_package:
    name: Build package
    needs: resolve_nightly_ref
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    outputs:
      nightly_version: ${{ steps.record_version.outputs.nightly_version }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - el/8
          - debian/bookworm
          - debian/trixie
          - ubuntu/jammy
          - ubuntu/noble
          - ubuntu/resolute
        arch: ${{ fromJSON(vars.DEB_BUILD_MULTI_ARCH == 'true' && '["amd64", "arm64"]' || '["amd64"]') }}
        exclude:
          - platform: el/8
            arch: arm64
    steps:
      - uses: actions/checkout@v6
      - if: hashFiles('scripts/release_helpers.py') == ''
        uses: actions/checkout@v6
        with:
          ref: develop
          path: tooling
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_KEY }}
          owner: citusdata
      - run: |
          echo "GH_TOKEN=${{ steps.app-token.outputs.token }}" >> "$GITHUB_ENV"
          echo "GITHUB_TOKEN=${{ steps.app-token.outputs.token }}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USER_NAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - uses: citusdata/packaging/.github/actions/setup-tools@develop
      - id: inputs
        env:
          NIGHTLY_SHA: ${{ needs.resolve_nightly_ref.outputs.sha }}
        run: |
          if [ -f pkgvars ]; then
            input_dir="$(pwd)"
          else
            git clone -b "${MAIN_BRANCH}" --depth=1 https://github.com/citusdata/packaging.git packaging
            input_dir="$(pwd)/packaging"
          fi
          sed -i "s/^nightlyref=.*/nightlyref=${NIGHTLY_SHA}/" "${input_dir}/pkgvars"
          echo "input_dir=${input_dir}" >> "$GITHUB_OUTPUT"
      - name: Build arm64 builder and debsigner images
        if: matrix.arch == 'arm64'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          t="."; [ -d tooling ] && t="tooling"
          (cd "${t}" && TEST=true TARGET_PLATFORM="${PLATFORM/\//,}" ./update_image)
          docker build -t citusdata/packaging:debsigner "${t}/dockerfiles/debsigner"
      - name: Build packages
        env:
          PLATFORM: ${{ matrix.platform }}
          INPUT_DIR: ${{ steps.inputs.outputs.input_dir }}
        run: |
          python -m tools.packaging_automation.citus_package \
            --gh_token "${GH_TOKEN}" --platform "${PLATFORM}" --build_type "nightly" \
            --secret_key "${PACKAGING_SECRET_KEY}" --passphrase "${PACKAGING_PASSPHRASE}" \
            --output_dir "$(pwd)/packages/" --input_files_dir "${INPUT_DIR}" --is_test
      - id: record_version
        run: |
          t="."; [ -d tooling ] && t="tooling"
          echo "nightly_version=$(python3 "${t}/scripts/release_helpers.py" nightly-ver "$(pwd)/packages")" >> "$GITHUB_OUTPUT"
      - name: Publish packages (idempotent)
        if: github.ref == 'refs/heads/develop'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          python scripts/release_helpers.py upload \
            "$(pwd)/packages" "${PLATFORM}" "${PACKAGE_CLOUD_REPO_NAME}" "${GITHUB_REF##*/}" "develop"

  test_nightlies:
    name: Test published nightly packages
    needs: build_package
    if: github.ref == 'refs/heads/develop' && needs.build_package.outputs.nightly_version != ''
    uses: citusdata/packaging/.github/workflows/test-package-installation.yml@develop
    with:
      citus_version: ${{ needs.build_package.outputs.nightly_version }}
      channel: community-nightlies
      retry_attempts: 6
