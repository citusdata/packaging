# This is a basic workflow to help you get started with Actions

name: Update Package Properties

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the develop branch

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Create GitHub App token
        id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Set GH_TOKEN for all steps
        run: echo "GH_TOKEN=${{ steps.app.outputs.token }}" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app.outputs.token }}

      - name: Configure git with x-access-token
        run: git config --global url."https://x-access-token:${{ steps.app.outputs.token }}@github.com/".insteadOf "https://github.com/"

      # Runs a single command using the runners shell
      - name: Clone Tools branch
        run: git clone --depth 1 --branch v0.8.35 https://github.com/citusdata/tools.git

      # Runs a set of commands using the runners shell
      - name: Execute Package Properties Update
        run: ./tools/bash/update_package_properties.sh
