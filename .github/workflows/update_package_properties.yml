name: Update Package Properties

env:
  PRJ_NAME: "citus"
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "The tag name on the project repo to be released"
        required: true
      fancy_version_no:
        description: "If fancy versioning is needed, set value greater than 1 e.g 2"
        default: "1"
        required: false
      microsoft_email:
        description: "Email to be written on changelogs"
        default: "gindibay@microsoft.com"
        required: false
      name:
        description: "Name to be written on changelogs"
        default: "Gurkan Indibay"
        required: false
      changelog_entry:
        description: "If filled, changelog other than default entry will be written"
        default: ""
        required: false

permissions:
  contents: read

jobs:
  update_package_properties:
    name: Update package properties
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_KEY }}
          owner: citusdata
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
      - name: Export app token to environment
        run: |
          echo "GH_TOKEN=${{ steps.app-token.outputs.token }}" >> "$GITHUB_ENV"
          echo "GITHUB_TOKEN=${{ steps.app-token.outputs.token }}" >> "$GITHUB_ENV"
      - name: Setup packaging tools
        uses: citusdata/packaging/.github/actions/setup-tools@develop
      - name: Set git name and email
        env:
          CHANGELOG_EMAIL: ${{ inputs.microsoft_email }}
          CHANGELOG_NAME: ${{ inputs.name }}
        run: |
          git config --global user.email "${CHANGELOG_EMAIL}"
          git config --global user.name "${CHANGELOG_NAME}"
      - name: Update package properties
        env:
          TAG_NAME: ${{ inputs.tag_name }}
          CHANGELOG_EMAIL: ${{ inputs.microsoft_email }}
          CHANGELOG_NAME: ${{ inputs.name }}
          FANCY_VER_NO: ${{ inputs.fancy_version_no }}
          CHANGELOG_ENTRY: ${{ inputs.changelog_entry }}
        run: |
          python -m tools.packaging_automation.update_package_properties \
            --gh_token "${GH_TOKEN}" \
            --prj_name "${PRJ_NAME}" \
            --tag_name "${TAG_NAME}" \
            --email "${CHANGELOG_EMAIL}" \
            --name "${CHANGELOG_NAME}" \
            --pipeline \
            --fancy_ver_no "${FANCY_VER_NO}" \
            --changelog_entry "${CHANGELOG_ENTRY}" \
            --exec_path "$(pwd)"
