name: Build Package

on:
  push:
    branches: ["**"]
    paths-ignore: [".github/**"]
  workflow_dispatch:
    inputs:
      force_docker:
        description: "Force Docker PR even when tag is not on Docker's active line"
        required: false
        default: false
        type: boolean

jobs:
  build:
    uses: citusdata/packaging/.github/workflows/reusable-build-package.yml@develop
    with:
      force_docker: ${{ inputs.force_docker == true }}
    secrets: inherit
