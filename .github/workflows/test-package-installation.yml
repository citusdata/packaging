name: Test Citus Package Installation on Supported PostgreSQL Versions

on:
  workflow_call:
    inputs:
      citus_version:
        required: true
        type: string
      channel:
        required: false
        default: community
        type: string
      retry_attempts:
        required: false
        default: 6
        type: number
  workflow_dispatch:
    inputs:
      citus_version:
        description: "Exact Citus package revision (e.g. 14.3.0.citus-1) or X.Y.Z; empty reads all-citus/pkgvars"
        required: false
        default: ""
        type: string
      channel:
        required: false
        default: community
        type: string
      retry_attempts:
        required: false
        default: 1
        type: number

env:
  SOURCE_BRANCH: "all-citus"

permissions:
  contents: read

jobs:
  discover:
    name: Discover platforms & versions
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      citus_version: ${{ steps.resolve.outputs.citus_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/all-citus' && github.ref || 'develop' }}
      - run: git fetch origin "${SOURCE_BRANCH}" --depth=1
      - id: resolve
        env:
          INPUT_CITUS_VERSION: ${{ inputs.citus_version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          git show "origin/${SOURCE_BRANCH}:postgres-matrix.yml" > /tmp/postgres-matrix.yml
          git show "origin/${SOURCE_BRANCH}:pg_exclude.yml" > /tmp/pg_exclude.yml || rm -f /tmp/pg_exclude.yml
          citus_version="${INPUT_CITUS_VERSION}"
          if [ -z "${citus_version}" ]; then
            [ "${CHANNEL}" = "community" ] || { echo "citus_version is required for ${CHANNEL}" >&2; exit 1; }
            citus_version=$(git show "origin/${SOURCE_BRANCH}:pkgvars" | grep '^pkglatest=' | cut -d= -f2-)
          fi
          wf=".github/workflows/reusable-build-package.yml"
          [ "${CHANNEL}" = "community-nightlies" ] && wf=".github/workflows/build-citus-community-nightlies.yml"
          platforms=$(yq -o=json '.jobs.build_package.strategy.matrix.platform' "${wf}" | jq -c '.')
          matrix=$(python3 scripts/release_helpers.py test-matrix /tmp/postgres-matrix.yml "${citus_version}" "${platforms}" "${CHANNEL}" /tmp/pg_exclude.yml)
          echo "citus_version=${citus_version}" >> "$GITHUB_OUTPUT"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  test_package:
    name: "PG${{ matrix.pg_version }}/Citus ${{ needs.discover.outputs.citus_version }} - ${{ matrix.platform }}"
    needs: discover
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/all-citus' && github.ref || 'develop' }}
      - uses: actions/setup-python@v5
        with:
          python-version: ">=3.10"
      - env:
          PLATFORM: ${{ matrix.platform }}
          PG_VERSION: ${{ matrix.pg_version }}
          CITUS_VERSION: ${{ needs.discover.outputs.citus_version }}
          CHANNEL: ${{ inputs.channel }}
          RETRY_ATTEMPTS: ${{ inputs.retry_attempts }}
        run: |
          python3 test_package_installation/run_test.py "${PLATFORM}" "${PG_VERSION}" "${CITUS_VERSION}" \
            --channel "${CHANNEL}" --retry-attempts "${RETRY_ATTEMPTS}"
