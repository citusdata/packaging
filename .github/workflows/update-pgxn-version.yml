name: Update Version on PGXN Config Files

on:
  workflow_dispatch:
    inputs:
      project_version:
        description: "Version number to be released e.g 14.3.0"
        required: true
        type: string
      pg_min_major:
        description: "Minimum supported PostgreSQL major version (optional; derived from all-citus/postgres-matrix.yml if empty)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  update_pgxn:
    name: Update pgxn configuration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_KEY }}
          owner: citusdata

      - name: Export App token to environment
        run: |
          echo "GH_TOKEN=${{ steps.app-token.outputs.token }}" >> "$GITHUB_ENV"
          echo "GITHUB_TOKEN=${{ steps.app-token.outputs.token }}" >> "$GITHUB_ENV"

      - name: Checkout pgxn-citus
        uses: actions/checkout@v6
        with:
          ref: pgxn-citus
          path: work
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup packaging tools
        uses: ./.github/actions/setup-tools

      - name: Update pgxn files
        env:
          PROJECT_VERSION: ${{ inputs.project_version }}
          PG_MIN_MAJOR: ${{ inputs.pg_min_major }}
        run: |
          if [ -z "${PG_MIN_MAJOR}" ]; then
            git fetch origin all-citus --depth=1
            git show origin/all-citus:postgres-matrix.yml > /tmp/postgres-matrix.yml
            PG_MIN_MAJOR=$(python3 scripts/release_helpers.py pg-min-major /tmp/postgres-matrix.yml "${PROJECT_VERSION}")
          fi
          git -C work config user.name "citus-bot"
          git -C work config user.email "packaging@citusdata.com"
          python -m tools.packaging_automation.update_pgxn \
            --prj_ver "${PROJECT_VERSION}" \
            --pg_min_major "${PG_MIN_MAJOR}" \
            --gh_token "${GH_TOKEN}" \
            --pipeline \
            --exec_path "$(pwd)/work"
