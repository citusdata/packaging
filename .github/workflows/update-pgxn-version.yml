name: Update Version on PGXN Config Files

env:
  PROJECT_VERSION: ${{ github.event.inputs.project_version }}
  GH_TOKEN: ${{ secrets.GH_TOKEN }}

on:
  workflow_dispatch:
    inputs:
      project_version:
        description: "Version number to be released e.g 10.0.3"
        required: true

jobs:
  update_pgxn:
    name: Update pgxn configuration
    runs-on: ubuntu-latest
    steps:
      # Mint the App token BEFORE checkout so checkout can persist it as the
      # credential used by the in-repo `git push` (the pgxn PR branch push lives
      # in the checked-out working dir under --pipeline mode). Without this, the
      # push would be authenticated by the default ephemeral Actions GITHUB_TOKEN
      # rather than the App token that opens the PR.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_KEY }}
          owner: citusdata

      - uses: actions/checkout@v6
        with:
          # Persist the App token as the push credential so the write-path
          # (git push of the pgxn-citus PR branch) is authenticated by the App,
          # consistent with the App-token PR creation below.
          token: ${{ steps.app-token.outputs.token }}

      - name: Export App token to environment
        run: |
          echo "GH_TOKEN=${{ steps.app-token.outputs.token }}" >> "$GITHUB_ENV"
          echo "GITHUB_TOKEN=${{ steps.app-token.outputs.token }}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev

      - name: Clone Tools branch
        run: git clone --branch v0.8.36 https://github.com/citusdata/tools.git

      - name: Install Python requirements
        run: python -m pip install -r tools/packaging_automation/requirements.txt

      - name: Update pgxn files
        run: |
          python -m tools.packaging_automation.update_pgxn \
          --prj_ver ${PROJECT_VERSION} \
          --gh_token ${GH_TOKEN} \
          --pipeline \
          --exec_path "$(pwd)"
